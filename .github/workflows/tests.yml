name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # The sample event log in examples/ must still produce a report.
      - run: python -m xray report examples/beanline_eventlog.csv --out report.html --as-of 2026-08-31T21:00:00
