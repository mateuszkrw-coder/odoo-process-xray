[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-process-xray"
version = "0.1.0"
description = "Process mining for Odoo: find where sales orders get stuck, from Odoo's own change history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
odoo-xray = "xray.__main__:main"

[tool.setuptools]
packages = ["xray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
