# Throwaway Odoo 19 Community + PostgreSQL used to generate the demo company.
# Not for production: default passwords, no volumes.
name: xray-demo

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 2s
      timeout: 5s
      retries: 30

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - ./:/mnt/demo:ro
