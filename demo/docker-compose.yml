# Throwaway Odoo + PostgreSQL used to generate the demo company.
# ODOO_VERSION picks the Odoo release (19.0 by default; 17.0 and 18.0 work too)
# and each version gets its own project, database and port, so they can run
# side by side. Not for production: default passwords, no volumes.
name: xray-demo-${ODOO_VERSION:-19.0}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 2s
      timeout: 5s
      retries: 30

  odoo:
    image: odoo:${ODOO_VERSION:-19.0}
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "${ODOO_PORT:-8069}:8069"
    volumes:
      - ./:/mnt/demo:ro
